name: Verify BrickMade durable database
on:
  push:
    branches: [main, codex/category-studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: studio-test-only
          POSTGRES_DB: brickmade_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgres://postgres:studio-test-only@postgres:5432/brickmade_test
          PGRST_DB_SCHEMAS: public,brickmade
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: brickmade-postgrest-fixture-secret-0123456789
        ports: [3009:3000]
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: studio-test-only
      PGDATABASE: brickmade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply Supabase fixture and actual migration
        run: |
          python3 - <<'PY'
          import subprocess
          for path in ['tests/sql/supabase-fixture.sql','supabase/migrations/202610150001_studio.sql','tests/sql/before-isolation.sql','supabase/migrations/202610150002_isolate_schema.sql','tests/sql/schema-isolation.sql']:
            r=subprocess.run(['psql','-v','ON_ERROR_STOP=1','-f',path],capture_output=True,text=True)
            if r.returncode:
              t=(path+'\n'+r.stdout+r.stderr)[-6000:]
              print('::error::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              raise SystemExit(r.returncode)
            print(path+': passed')
          PY
      - name: Exercise durable queue, ownership and recovery
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/studio.sql
      - name: Exercise actual PostgREST transport and RLS
        run: |
          psql -c "notify pgrst, 'reload schema'"
          node tests/sql/rest-transport.mjs > /tmp/brickmade-rest.log 2>&1 || {
            python3 - <<'PYDIAG'
          from pathlib import Path
          t=Path('/tmp/brickmade-rest.log').read_text()[-6000:]
          print('::error::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYDIAG
            exit 1
          }
